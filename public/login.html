<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Chat-Box</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card {
      width: 100%; max-width: 360px; background: var(--panel); padding: 28px;
      border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .login-card h1 { margin: 0 0 6px; font-size: 20px; }
    .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .login-card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    .login-card input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--panel-2);
      color: var(--text); font-size: 14px; outline: none;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button {
      width: 100%; margin-top: 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; padding: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .login-card button:hover { background: var(--accent-2); }
    .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Admin Login</h1>
      <p>Sign in to manage Chat-Box.</p>

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { errEl.textContent = data.error || 'Login failed'; return; }
        localStorage.setItem('adminToken', data.token);
        window.location.href = '/admin';
      } catch (err) {
        errEl.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
